name: flake check

# check は ruleset の必須チェックなので、全 PR で必ず報告されるよう paths フィルタは使わない。
# nix に関係しない PR では check を skip する（skip は必須チェック上 success 扱い）。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      nix: ${{ steps.filter.outputs.nix }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "nix=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')
          if printf '%s\n' "$files" | grep -qE '^(flake\.nix|flake\.lock|nix/|renovate\.json|\.github/workflows/)'; then
            echo "nix=true" >> "$GITHUB_OUTPUT"
          else
            echo "nix=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: nix flake check
        run: nix flake check --all-systems --no-build

      - name: Evaluate darwinConfigurations
        run: |
          nix eval .#darwinConfigurations.personal.system.outPath --raw
          nix eval .#darwinConfigurations.work.system.outPath --raw
