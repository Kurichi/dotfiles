name: flake check

on:
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - "nix/**"
      - renovate.json
      - ".github/workflows/**"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: nix flake check
        run: nix flake check --all-systems --no-build

      - name: Evaluate darwinConfigurations
        run: |
          nix eval .#darwinConfigurations.personal.system.outPath --raw
          nix eval .#darwinConfigurations.work.system.outPath --raw
